.gold{color:#f0c040}

/* fotogramas: 0-1 reposo, 2-5 caminata */
function framePose(ch,f){
 const walk=f>=2,ph=f-2;
 const pose={bodyDy:0,legs:[]};
 if(!walk)pose.bodyDy=f===1?1:0;
 else pose.bodyDy=(ph%2===1)?-1:0;
 if(ch.hop&&walk)pose.bodyDy=[0,-3,-2,0][ph];
 ch.legs.forEach((L,i)=>{
  let dx=0,dy=0;
  if(walk){
   const phase=ch.biped?(i===0?0:2):((i%2)===((i>>1)&1)?0:2);
   const p=(ph+phase)%4;
   dx=[-2,0,2,0][p];dy=[0,-1,0,0][p];
   if(ch.hop){dx=0;dy=[0,-2,-1,0][ph]}
  }
  pose.legs.push({dx,dy});
 });
 return pose;
}
function composeFrame(name,f){
 const ch=CHARS[name],pose=framePose(ch,f);
 const H=ch.h+2;
 const g=Array.from({length:H},()=>Array(ch.w).fill('.'));
 const stamp=(rows,x,y,dark)=>rows.forEach((r,j)=>[...r].forEach((c,i)=>{if(c==='.')return;const X=x+i,Y=y+j;if(X<0||Y<0||X>=ch.w||Y>=H)return;g[Y][X]=dark?(DARKER[c]||c):c}));
 const leg=PARTS[ch.leg];
 ch.legs.forEach((L,i)=>{if(L.far)stamp(leg,L.x+pose.legs[i].dx,ch.legY+1+pose.legs[i].dy,true)});
 stamp(PARTS[ch.body],0,1+pose.bodyDy,false);
 ch.legs.forEach((L,i)=>{if(!L.far)stamp(leg,L.x+pose.legs[i].dx,ch.legY+1+pose.legs[i].dy,false)});
 return g.map(r=>r.join(''));
}
/* contorno selectivo + oclusión suave + luz de borde */
function renderRows(rows){
 const w=rows[0].length,h=rows.length,W=w+2,H=h+2;
 const at=(i,j)=>(i<0||j<0||i>=w||j>=h)?'.':rows[j][i];
 const hex2=c=>[1,3,5].map(k=>parseInt(c.slice(k,k+2),16));
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const img=x.createImageData(W,H);
 const put=(i,j,rgb)=>{const o=(j*W+i)*4;img.data[o]=rgb[0];img.data[o+1]=rgb[1];img.data[o+2]=rgb[2];img.data[o+3]=255};
 const mix=(a,b,t)=>a.map((v,k)=>Math.round(v+(b[k]-v)*t));
 for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){
  const ch=at(i,j);
  if(ch==='.'){
   const n=[[0,-1],[0,1],[-1,0],[1,0]].map(([a,b])=>at(i+a,j+b)).find(q=>q!=='.'&&q!=='k');
   const any=[[0,-1],[0,1],[-1,0],[1,0]].some(([a,b])=>at(i+a,j+b)!=='.');
   if(any)put(i+1,j+1,n?mix(hex2(PAL3[n]),[16,8,28],.78):hex2(PAL3.k));
   continue;
  }
  let rgb=hex2(PAL3[ch]||'#ff00ff');
  const top=at(i,j-1)==='.'||at(i-1,j)==='.';
  if(top&&ch!=='k'&&ch!=='q')rgb=mix(rgb,[255,244,214],.22);
  const btm=at(i+1,j)==='.'||at(i,j+1)==='.'||at(i+1,j+1)==='.';
  if(btm&&!top&&ch!=='k'&&ch!=='q')rgb=mix(rgb.map(v=>v*.78),[42,24,64],.2);
  rgb=rgb.map(v=>Math.round(v*(1-.12*(j/h))));
  put(i+1,j+1,rgb);
 }
 x.putImageData(img,0,0);return c;
}
function buildFrames(name){return[0,1,2,3,4,5].map(f=>renderRows(composeFrame(name,f)))}


const billboards=[];
function makeBillboard(key,scale=1,ringCol=0xff4a3a,hue=0){
 const canv=buildFrames(key,hue);
 const frames=canv.map(c=>{const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.colorSpace=THREE.SRGBColorSpace;return t});
 const c=canv[0];const u=.03*scale,w=c.width*u,h=c.height*u,ws=(c.width-2*(c._pad||0))*u;
 const geo=new THREE.PlaneGeometry(w,h);geo.translate(0,h/2-u,0);
 const mat=new THREE.MeshStandardMaterial({map:frames[0],alphaTest:.5,side:THREE.DoubleSide,roughness:1,emissive:0xffffff,emissiveMap:frames[0],emissiveIntensity:.22});
 const m=new THREE.Mesh(geo,mat);m.castShadow=true;m.userData.mat=mat;
 const shadow=new THREE.Mesh(new THREE.CircleGeometry(Math.min(ws,1.2)*.34,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.4,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.012;
 const g=new THREE.Group();g.add(shadow);g.add(m);
 const rw=Math.min(ws,1.2);const ring=new THREE.Mesh(new THREE.RingGeometry(rw*.3,rw*.38,24),new THREE.MeshBasicMaterial({color:ringCol,transparent:true,opacity:.85,depthWrite:false}));ring.rotation.x=-Math.PI/2;ring.position.y=.016;g.add(ring);g.userData.ring=ring;g.userData.spr=m;g.userData.frames=frames;g.userData.faceLeft=['jaguar','aguila','sacerdotisa','pochteca'].includes(key)&&!c._hero;g.userData.heroArt=c._hero||null;g.userData.flip=1;g.userData.h=h;g.userData.idleN=c._idleN||0;g.userData.atkN=c._atkN||0;g.userData.walk=false;g.userData.off=Math.random()*3;scene.add(g);billboards.push(g);return g;
}
const slotPos0=(h,slot)=>new THREE.Vector3(wx(h)+h.stand[0]+slot,h.top,wz(h)+h.stand[1]);
const place=(obj,h,slot=0)=>{obj.position.copy(slotPos0(h,slot));obj.userData.hex=h};
const all=[...hexes.values()];
const capital=all.find(h=>h.t==='K');
const hero=makeBillboard('jaguar',1,0xf0c040);place(hero,capital,-.34);
const ally=makeBillboard('aguila',1,0x38c0b0);place(ally,capital,.34);
const free=f=>shuffle(all.filter(h=>f(h)&&!TERR[h.t].city&&!TERR[h.t].water&&h!==capital&&!billboards.some(b=>b.userData.hex===h)));
const coy=makeBillboard('calaca');place(coy,free(h=>h.t==='S'||h.t==='M')[0]);
const ahu=makeBillboard('tzitzimitl',.9);place(ahu,free(h=>nbrs(hexes,h).some(n=>n.t==='L'))[0]);
const cip=makeBillboard('tlaltecuhtli',.8);const vh=free(h=>h.t==='V')[0];place(cip,vh);

/* marcadores */
const arrowTex=pixTex((x)=>{const rows=["kkkkkkk","kyyyyyk",".kyyyk.","..kyk..","...k..."];rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=ch==='k'?'#120c18':'#f0c040';x.fillRect(i,j,1,1)}}))},7,5);
const arrow=new THREE.Sprite(new THREE.SpriteMaterial({map:arrowTex,depthTest:false,transparent:true}));arrow.scale.set(.28,.2,1);arrow.renderOrder=10;scene.add(arrow);
const ringGeo=new THREE.RingGeometry(RAD*.78,RAD*.9,6);ringGeo.rotateX(-Math.PI/2);ringGeo.rotateY(Math.PI/6);
const ringMat=new THREE.MeshBasicMaterial({color:0xf0c040,transparent:true,opacity:.8,depthWrite:false});
const rings=[];
function showMoves(){rings.forEach(r=>scene.remove(r));rings.length=0;const h=hero.userData.hex;
 nbrs(hexes,h).filter(n=>!TERR[n.t].water).forEach(n=>{const r=new THREE.Mesh(ringGeo,ringMat);r.position.set(wx(n),n.top+.02,wz(n));r.userData.hex=n;scene.add(r);rings.push(r)})}
showMoves();

/* partículas */
function points(n,size,color,opacity,blend){const g=new THREE.BufferGeometry();const p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(rnd()-.5)*22;p[i*3+1]=rnd()*3+.6;p[i*3+2]=(rnd()-.5)*20}g.setAttribute('position',new THREE.BufferAttribute(p,3));const m=new THREE.PointsMaterial({size,color,transparent:true,opacity,depthWrite:false,blending:blend||THREE.NormalBlending,sizeAttenuation:true});const o=new THREE.Points(g,m);scene.add(o);return o}
const dust=points(120,.05,0xfff4d0,.55);
const flies=points(70,.09,0xd8ff70,0,THREE.AdditiveBlending);
const smokeG=new THREE.BufferGeometry();const SMK=40;const smokeP=new Float32Array(SMK*3),smokeL=new Float32Array(SMK);
const vols=all.filter(h=>h.t==='V');
for(let i=0;i<SMK;i++){smokeL[i]=rnd()}
smokeG.setAttribute('position',new THREE.BufferAttribute(smokeP,3));
const smoke=new THREE.Points(smokeG,new THREE.PointsMaterial({size:.22,color:0x8a8090,transparent:true,opacity:.45,depthWrite:false}));scene.add(smoke);

/* post-proceso */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.45,.5,.82);composer.addPass(bloom);
const mkTilt=horiz=>({uniforms:{tDiffuse:{value:null},h:{value:1/512},v:{value:1/512},r:{value:.5},band:{value:.22}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
 fragmentShader:`uniform sampler2D tDiffuse;uniform float h;uniform float v;uniform float r;uniform float band;varying vec2 vUv;
 void main(){float k=max(0.0,abs(r-vUv.y)-band)*1.8;vec2 d=${horiz?'vec2(h*k,0.0)':'vec2(0.0,v*k)'};vec4 s=vec4(0.0);
 s+=texture2D(tDiffuse,vUv-4.0*d)*0.051;s+=texture2D(tDiffuse,vUv-3.0*d)*0.0918;s+=texture2D(tDiffuse,vUv-2.0*d)*0.12245;s+=texture2D(tDiffuse,vUv-1.0*d)*0.1531;
 s+=texture2D(tDiffuse,vUv)*0.1633;s+=texture2D(tDiffuse,vUv+1.0*d)*0.1531;s+=texture2D(tDiffuse,vUv+2.0*d)*0.12245;s+=texture2D(tDiffuse,vUv+3.0*d)*0.0918;s+=texture2D(tDiffuse,vUv+4.0*d)*0.051;gl_FragColor=s;}`});
const hT=new ShaderPass(mkTilt(true)),vT=new ShaderPass(mkTilt(false));
hT.uniforms.r.value=vT.uniforms.r.value=.52;
const BLUR={apagado:0,suave:1.1,normal:2.8};let blurMode=(matchMedia('(pointer:fine)').matches&&innerWidth>820)?'suave':'normal';composer.addPass(hT);composer.addPass(vT);
composer.addPass(new OutputPass());

let quality='alta';
function resize(){
 const w=innerWidth,h=innerHeight,pr=quality==='alta'?Math.min(devicePixelRatio,2):1;
 renderer.setPixelRatio(pr);renderer.setSize(w,h,false);composer.setPixelRatio(pr);composer.setSize(w,h);
 camera.aspect=w/h;camera.updateProjectionMatrix();
 const blur=BLUR[blurMode];hT.enabled=vT.enabled=blur>0;hT.uniforms.h.value=blur/(w*pr);vT.uniforms.v.value=blur/(h*pr);
 if(w<h&&!resize.done){camera.position.set(0,27,26);resize.done=true}
}
addEventListener('resize',resize);resize();
document.getElementById('bQ').onclick=e=>{quality=quality==='alta'?'baja':'alta';e.target.textContent='Calidad: '+quality;bloom.enabled=quality==='alta';sun.shadow.mapSize.set(quality==='alta'?2048:1024,quality==='alta'?2048:1024);sun.shadow.map?.dispose();sun.shadow.map=null;resize()};
document.getElementById('bRot').onclick=e=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=.6;e.target.classList.toggle('sel',controls.autoRotate)};

/* fases del día */
const PH=[
 {sun:[7,11,6],sc:0xfff1d6,si:2.5,hs:0xbcd8ff,hg:0x6a5a3a,hi:1,bg:0xa9cbe8,fog:0xc8dcea,exp:1.05,night:0},
 {sun:[-10,4.5,5],sc:0xff9a58,si:2.3,hs:0xffc8a0,hg:0x5a3a2a,hi:.75,bg:0xe39a6a,fog:0xe8b088,exp:1.0,night:.3},
 {sun:[5,12,-7],sc:0x7a90ff,si:.45,hs:0x2a3470,hg:0x120c1c,hi:.45,bg:0x0c1028,fog:0x161c40,exp:1.15,night:1}
];
let cur={},target=PH[0];
scene.fog=new THREE.Fog(0xc8dcea,40,95);scene.background=new THREE.Color(0xa9cbe8);
const lerpC=(a,b,t)=>a.lerp(new THREE.Color(b),t);
function setPhase(i){target=PH[i];document.querySelectorAll('[data-ph]').forEach(b=>b.classList.toggle('sel',+b.dataset.ph===i))}
document.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>setPhase(+b.dataset.ph));
const sunPos=new THREE.Vector3(...PH[0].sun);let night=0;

/* interacción */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null,hop=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointerup',e=>{
 if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)return;down=null;
 ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
 const hit=ray.intersectObjects([...rings,...pickables],false)[0];if(!hit)return;const h=hit.object.userData.hex;
 const info=document.getElementById('info');
 const beast=[coy,ahu,cip].find(b=>b.userData.hex===h);
 const names={coy:'Coyote nahual',ahu:'Ahuízotl',cip:'Cipactli'};
 let txt=`<span class="gold">${h.name||TERR[h.t].name}</span>`;
 if(beast)txt+=` · ${beast===coy?names.coy:beast===ahu?names.ahu:names.cip} acecha aquí.`;
 if(TERR[h.t].water)txt+=' · El agua no se puede cruzar.';
 if(rings.some(r=>r.userData.hex===h)&&!hop){const from=hero.position.clone(),to=slotPos(h,(beast||h===ally.userData.hex)?-.34:0);if(beast)beast.position.copy(slotPos(h,.34));if(hero.userData.hex===ally.userData.hex)place(ally,ally.userData.hex,0);if(h===ally.userData.hex)place(ally,h,.34);const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);const goesRight=to.clone().sub(from).dot(right)>0;hero.userData.flip=goesRight?-1:1;hero.userData.walk=true;hop={from,to,t0:performance.now(),h};txt+=' · El jaguar avanza.'}
 info.innerHTML=txt;
});

/* bucle */
const clock=new THREE.Clock();const camDir=new THREE.Vector3();
function tick(){
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 const k=.04;
 sunPos.lerp(new THREE.Vector3(...target.sun),k);sun.position.copy(sunPos);sun.target.position.set(0,0,0);
 lerpC(sun.color,target.sc,k);sun.intensity+=(target.si-sun.intensity)*k;
 lerpC(hemi.color,target.hs,k);lerpC(hemi.groundColor,target.hg,k);hemi.intensity+=(target.hi-hemi.intensity)*k;
 lerpC(scene.background,target.bg,k);lerpC(scene.fog.color,target.fog,k);
 renderer.toneMappingExposure+=(target.exp-renderer.toneMappingExposure)*k;night+=(target.night-night)*k;
 torches.forEach((p,i)=>p.intensity=(p.userData.f||1)*night*2.6*(0.85+.15*Math.sin(t*9+i*2)));
 MAT.flame.emissiveIntensity=.3+night*3;MAT.door.emissiveIntensity=night*1.6;
 lavas.forEach((p,i)=>p.intensity=(1.2+night*2.2)*(0.85+.15*Math.sin(t*5+i)));
 MAT.lava.emissiveIntensity=2+night*2;
 dust.material.opacity=.5*(1-night);flies.material.opacity=night*.95;
 const dp=dust.geometry.attributes.position;for(let i=0;i<dp.count;i++){dp.setY(i,.6+((dp.getY(i)-.6+dt*.08)%3));dp.setX(i,dp.getX(i)+Math.sin(t*.5+i)*.002)}dp.needsUpdate=true;
 const fp=flies.geometry.attributes.position;for(let i=0;i<fp.count;i++){fp.setX(i,fp.getX(i)+Math.sin(t*1.3+i*7)*.006);fp.setY(i,1+Math.abs(Math.sin(t*.7+i))*1.4);fp.setZ(i,fp.getZ(i)+Math.cos(t*1.1+i*3)*.006)}fp.needsUpdate=true;
 for(let i=0;i<SMK;i++){smokeL[i]+=dt*.25;if(smokeL[i]>1)smokeL[i]-=1;const v=vols[i%vols.length];const l=smokeL[i];smokeP[i*3]=wx(v)+Math.sin(i*3+l*4)*.25*l;smokeP[i*3+1]=v.smokeY+l*2.2;smokeP[i*3+2]=wz(v)-.3+Math.cos(i*5)*.2*l}
 smokeG.attributes.position.needsUpdate=true;smoke.material.opacity=.45*(1-night*.5);
 waters.forEach(m=>{m.map.offset.x=t*.02;m.map.offset.y=Math.sin(t*.4)*.02});if(window.canoes)canoes.forEach(c=>{const u=c.userData;const a=u.ang+t*u.sp;c.position.x=Math.cos(a)*u.dist;c.position.z=Math.sin(a)*u.dist;c.position.y=.13+Math.sin(t*1.3+u.ph)*.012;c.rotation.y=-a-Math.PI/2;c.rotation.z=Math.sin(t*1.1+u.ph)*.03});
 if(hop){const p=Math.min(1,(performance.now()-hop.t0)/650);hero.position.lerpVectors(hop.from,hop.to,p);hero.position.y+=Math.sin(p*Math.PI)*.3;if(p>=1){hero.userData.hex=hop.h;hero.userData.walk=false;hop=null;showMoves()}}
 ringMat.opacity=.55+.3*Math.sin(t*4);arrow.position.set(hero.position.x,hero.position.y+1.75+Math.sin(t*4)*.08,hero.position.z);
 for(const b of billboards){camDir.subVectors(camera.position,b.position);const m=b.userData.spr;m.rotation.y=Math.atan2(camDir.x,camDir.z);const U=b.userData;const fi=U.walk?2+Math.floor(t*11)%4:Math.floor(t*2.2+U.off)%2;if(m.userData.mat.map!==U.frames[fi]){m.userData.mat.map=U.frames[fi];m.userData.mat.emissiveMap=U.frames[fi]}m.scale.x=U.flip;m.userData.mat.emissiveIntensity=.22+night*.3;b.userData.ring.material.opacity=.6+.25*Math.sin(t*3+b.position.z)}
 controls.update();composer.render();requestAnimationFrame(tick);
}
document.getElementById('load').remove();tick();
</script>
